                      - generic [ref=f5e903]: "Off by default. If active, tickets that belong to no order — for example numbers you generated yourself for printed cards — can be opened, shown and redeemed at the scanner. You give up the order check as copy protection for those tickets: the plugin can no longer verify against a paid order, only that the number exists, is active, is not redeemed yet and belongs to its ticket list. Tickets sold through WooCommerce are unaffected and keep the full check. You can also switch this on for a single ticket list instead of the whole shop, in the list's settings."
