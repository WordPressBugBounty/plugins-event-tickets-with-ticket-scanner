                    - generic [ref=f5e831]: "Each output reachable through the ticket link can be switched off individually. When off, the view is no longer rendered and a short \"deactivated\" notice (or 403 for downloads) is shown instead. Turn views off you don't use to reduce the public surface of the ticket link — important if you also enable redeeming by plain ticket number. Note: links you already sent (e.g. in emails) to a disabled view will stop working."
