                        - /url: https://youtu.be/KhJXtuBnr10
                      - text: If your theme is showing the 404 title or the ticket is not rendered at all, then you can try to use this compatibility mode. If active, then the URL /ticket/XYZ will be /ticket/?code=XYZ URL for the link to the ticket detail and ticket PDF page. Some themes causing issues with the normal mode.
                    - generic [ref=f5e794]:
                      - checkbox [ref=f5e795] [cursor=pointer]
                      - text: "Compatibility mode for ticket images using URL instead of file location {wcTicketCompatibilityUseURL}"
                      - generic [ref=f5e796]: "If your images on the PDF are not shown then this option trigger not to use the file location but an URL to your image. Note: Your firewall need to allow your system to call itsself to download the image that will be added to the PDF."
