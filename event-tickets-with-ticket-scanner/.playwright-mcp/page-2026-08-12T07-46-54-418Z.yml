                        - /url: https://youtu.be/8ynFKPc-xKE
                      - text: Some plugins and/or themes are injecting a ob (caching) operation and this can harm the PDF generation. If you experience, that your PDF ticket is not rendered, you can try to activate this option. But it can slow down a bit your wordpress installation!
                    - generic [ref=f5e801]:
                      - text: "Rest Service URL path {wcTicketCompatibilityModeRestURL}"
