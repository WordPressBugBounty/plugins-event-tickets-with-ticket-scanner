                    - heading "Compatibility Mode" [level=3] [ref=f5e784]
                    - generic [ref=f5e785]: These settings can help to make it work, in case you adjusted your server and/or Wordpress settings.
                    - generic [ref=f5e786]:
                      - text: "Ticket detail URL path {wcTicketCompatibilityModeURLPath}"
