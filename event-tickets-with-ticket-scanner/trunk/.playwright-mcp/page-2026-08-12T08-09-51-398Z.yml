              - generic [ref=f12e100]:
                - heading "Business-OS Daily Report – 2026-08-12" [level=1] [ref=f12e101]
                - heading "Kurzfassung (30 Sekunden lesen)" [level=2] [ref=f12e102]
                - paragraph [ref=f12e103]: "Heute 0 EUR Umsatz, 7-Tage-Trend −53,5% (391,90 EUR vs. ~843 EUR Vorwoche) — das ist der zweite Halbierungs-Einbruch in vier Wochen. Gleichzeitig explodieren die Event-Tickets-Downloads auf WP.org: 973 in 7 Tagen, +234% zur Vorwoche, bei 0 EUR Ads-Kosten. Der Funnel oben füllt sich also rein organisch, unten kommt nichts an — die Free→Pro-Conversion ist der Engpass, nicht die Reichweite. Konkret: Warum 10 von 74 Bestellungen (13,5%) failed sind, ist die einzige Zahl mit direkt erreichbarem Geld dahinter."
                - heading "Umsatz & Sales" [level=2] [ref=f12e104]
                - list [ref=f12e105]:
                  - listitem [ref=f12e106]: "Heute: 0,00 EUR"
                  - listitem [ref=f12e107]: "7d: 391,90 EUR (−53,52% vs. Vorwoche)"
                  - listitem [ref=f12e108]: "30d: 2.752,66 EUR, 54 completed Orders, AOV 50,98 EUR"
                  - listitem [ref=f12e109]: "Produktmix 30d: Event Tickets 2.379,66 EUR (86,4%), Serial Codes 245 EUR (8,9%), Perfex-Module 116 EUR (4,2%)"
                - paragraph [ref=f12e110]: Bei 10.000 EUR/Monat Ziel liegt der Ist-Stand bei 27,5%. Die Abhängigkeit von einem Produkt (86%) ist unverändert hoch.
                - paragraph [ref=f12e111]: "Order-Status ist das Auffälligste: 10 failed + 5 pending + 4 cancelled = 19 von 74 Orders (25,7%) haben nicht abgeschlossen. Bei AOV 51 EUR sind das nominell ~970 EUR im Raum. Die Failed-Analyse vom 18.03. hat 67% Selbst-Recovery über Stripe-Retry gezeigt — bei 10 Failed in 30 Tagen wären das ~3 echte Verluste. Nicht dramatisch, aber die 5 pending sind unklar: pending heißt bei WooCommerce nicht bezahlt, aber auch nicht gescheitert. Die sollten mal einzeln angesehen werden."
                - paragraph [ref=f12e112]: "Serial Codes: 6 Verkäufe/30d à ~41 EUR Durchschnitt. Die Preissenkung 80→50 EUR hält den Umsatz, aber die WP.org-Downloads sinken (−8,4% 7d). Kein Wachstum."
                - heading "Piracy & Lizenzen" [level=2] [ref=f12e113]
                - list [ref=f12e114]:
                  - listitem [ref=f12e115]: 3.666 Checks, 1.669 erfolgreich (45,5% Erfolgsquote)
                  - listitem [ref=f12e116]: Piracy-Rate 1,09% — unauffällig, System greift
                  - listitem [ref=f12e117]: Domain-Mismatch 8,48% bei 874 unique Domains
                  - listitem [ref=f12e118]: Support-expired 20,68% — jeder fünfte Check kommt von einer Lizenz ohne aktiven Support
                  - listitem [ref=f12e119]: Aktive Lizenzen 7.025, davon nur 2.083 verkauft, 4.942 manuell
                - paragraph [ref=f12e120]: "Die 20,68% expired-Rate ist die wichtigste Lizenz-Zahl. Bei 2.083 verkauften Lizenzen sind das grob 430 Kunden mit abgelaufenem Support, die das Plugin weiter aktiv nutzen. Die RENEW20-Mails laufen — aus dem Tracker: 52 expired-Lizenz-Mails, 0 Conversions nach 5 Tagen (Stand 12.08. früh). Das ist ein Signal: Rabatt-Mails an Expired funktionieren aktuell nicht. Das deckt sich mit dem Ergebnis vom 18.03. (\"Win-back erst bei Feature-Update sinnvoll, nicht mit Coupon\")."
                - paragraph [ref=f12e121]: Das Verhältnis 4.942 manuell zu 2.083 verkauft bleibt schräg — 70% der aktiven Lizenzen sind nie durch die Kasse gegangen.
                - heading "Support" [level=2] [ref=f12e122]
                - paragraph [ref=f12e123]: "0 offene Tickets. 85 echte Tickets in 30 Tagen, 35 mit Reply. Durchschnittliche Erstantwort 495 Minuten (8,25 h), Maximum 5.294 Minuten (~3,7 Tage). Einziges erkanntes Top-Thema: AngelReminder (3). 41 Autoresponder-Tickets, 42 geschlossen."
                - paragraph [ref=f12e124]: Die 8,25 h Schnitt sind für ein Ein-Mann-Produkt okay, der 3,7-Tage-Ausreißer nicht. Bei 0 offenen Tickets besteht aber kein akuter Handlungsdruck.
                - heading "Empfehlungen (priorisiert)" [level=2] [ref=f12e125]
                - paragraph [ref=f12e126]:
                  - strong [ref=f12e127]: 1. Perfex-Modul-Statusliste aktualisieren (offener Task aus Tracker)
                  - text: "Der einzige noch offene Tracker-Punkt. Die heutigen Daten belegen die Dringlichkeit: Purchase Pro macht 29 EUR/2 Stück Umsatz, ist also nachweislich live und verkauft — steht aber nicht als solches in der Liste. Inventory Pro 87 EUR/4 Stück, VAT Rates 1 Stück zu 0 EUR (Freebie? Bug?). Quelle: Lizenzserver + WooCommerce-Produkte. Der VAT-Rates-Verkauf mit 0,00 EUR Umsatz bei Quantity 1 gehört dabei mitgeprüft — entweder Test-Order oder ein Preisfehler im Produkt."
                - paragraph [ref=f12e128]:
                  - strong [ref=f12e129]: 2. Free→Pro-Conversion von Event Tickets messen, bevor irgendwas anderes passiert
                  - text: "Neu aus heutigen Daten: 3.264 Downloads in 30 Tagen, 42 verkaufte Event-Tickets-Lizenzen. Das sind 1,3% — und die 42 sind größtenteils Renewals, nicht Neukunden. Bei 973 Downloads/7d und +234% Trend ist die Reichweite kein Problem mehr. Die Frage ist, was zwischen Free-Installation und Pro-Kauf passiert. Konkret messbar: Wie viele der Free-Installationen sehen überhaupt jemals einen Pro-Hinweis, und wo bricht es ab. Ohne diese Zahl ist jede weitere Marketing-Ausgabe blind."
                - paragraph [ref=f12e130]:
                  - strong [ref=f12e131]: 3. Die 5 pending Orders einzeln durchgehen
                  - text: 25,7% nicht-abgeschlossene Orders. Failed ist analysiert (67% Selbst-Recovery), pending nicht. 5 Orders à ~51 EUR = ~255 EUR, die weder bezahlt noch gescheitert sind. Das ist ein 15-Minuten-Check im WooCommerce-Backend.
                - paragraph [ref=f12e132]:
                  - strong [ref=f12e133]: "4. Appointment Desk: Entscheidung fällig, nicht weiter beobachten"
                  - text: 46 Downloads in 30 Tagen, 0 active_installs, 0 Ratings, 0 EUR Umsatz — vier Monate nach der Beta-Kampagne an 893 Bestandskunden. Die Re-Eval-Schwelle aus dem Pricing-Projekt (25 DLs/Tag oder 5+ Reviews) ist bei 1,5 DLs/Tag um Faktor 16 verfehlt. Das Produkt hat keinen Markt gefunden über den bestehenden Kanal. Entweder ein anderer Kanal wird getestet oder es wird auf Wartungsmodus gesetzt — weiteres passives Beobachten kostet nur Aufmerksamkeit.
                - paragraph [ref=f12e134]: "Zu Google Ads: Alle 5 Kampagnen sind laut Funnel-Engine pausiert (26–48 Tage ohne Aktivität), Kosten 10d = 0 EUR. Der Revenue-Einbruch von −53% ist zeitlich kompatibel mit dem Pause-Zeitpunkt, aber die Kampagnen hatten bei 12,6x ROAS nur 211 EUR/30d Volumen — sie erklären den Einbruch nicht. Empfehlungen dazu stehen in der Funnel-Engine."
                - heading "Auffälligkeiten" [level=2] [ref=f12e135]
                - paragraph [ref=f12e136]:
                  - strong [ref=f12e137]: Download-Explosion ohne Umsatzeffekt.
                  - text: "Event Tickets +234% Downloads bei gleichzeitig −53% Umsatz und 0 EUR Ads-Ausgaben. Zwei mögliche Erklärungen: entweder ein echter organischer Schub (Version 3.1.5, Rating 94 bei 23 Bewertungen), oder Bot-/Mirror-Traffic. 139 Downloads/Tag bei nur 1.000 active_installs ist ein Verhältnis, das stutzig macht — die Installationsbasis wächst nicht mit. Das ist prüfbar über die Lizenz-Check-Zahlen: 874 unique Domains bei 3.666 Checks passt nicht zu 139 täglichen Neuinstallationen."
                - paragraph [ref=f12e138]:
                  - strong [ref=f12e139]: 45,5% Lizenz-Check-Erfolgsquote.
                  - text: 1.997 von 3.666 Checks schlagen fehl, aber nur 1,09% davon sind Piracy und 8,48% Domain-Mismatch. Das erklärt zusammen knapp 10% — bleiben ~35% fehlgeschlagene Checks ohne benannten Grund. Entweder ein Kategorisierungs-Loch in der Statistik oder ein technisches Problem beim Lizenzserver. Bei 7.025 aktiven Lizenzen ist das die Zahl, hinter der am ehesten ein stiller Bug steckt.
